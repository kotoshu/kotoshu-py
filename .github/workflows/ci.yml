name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Server under test
        run: |
          gem install kotoshu-server --no-document
          kotoshu setup en
          nohup kotoshu-server >/tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:9292/v1/health >/dev/null 2>&1 && { echo "server up"; exit 0; }
            sleep 1
          done
          echo "server never became healthy" >&2; exit 1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        run: python -m pytest -q
      - name: Wheel builds
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl --force-reinstall --no-deps
          python -c "import kotoshu; print(kotoshu.__name__)"
