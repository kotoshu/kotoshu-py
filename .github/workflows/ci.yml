name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        run: python -m pytest -q
      - name: Wheel builds
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl --force-reinstall --no-deps
          python -c "import kotoshu; print(kotoshu.__name__)"
